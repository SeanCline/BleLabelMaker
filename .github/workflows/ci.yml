name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The usual output, plus a reporter that puts each failure on the commit as an annotation:
# job logs need admin rights to read, annotations don't.
env:
  REPORTERS: >-
    --test-reporter=spec --test-reporter-destination=stdout
    --test-reporter=./test/github-reporter.mjs --test-reporter-destination=stdout

jobs:
  test:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      # npm run coverage, step by step: npm test and npm run test:e2e under c8, with the
      # reporters. Node only takes reporter options before the file patterns, so these call node
      # directly.
      - run: npx c8 --reporter=none node --test $REPORTERS "test/*.test.js"
      # The Ubuntu image ships Google Chrome at /usr/bin/google-chrome, which the e2e harness finds.
      # The harness adds what ran in the browser to the same coverage.
      - run: npx c8 --clean=false --reporter=none node --test --test-concurrency=3 $REPORTERS "test/e2e/*.e2e.js"
      # The per-file table goes on the run's summary page; the floors are in app/.c8rc.json.
      - name: Coverage
        run: |
          { echo "### Coverage"; echo '```'; npx c8 report --reporter=text; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          npx c8 report --check-coverage

  # The same browser tests in Firefox, which has no Web Bluetooth or Web Serial: DESIGN.md
  # promises everything else works there. Tests that Firefox can't drive skip themselves.
  firefox:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The image installs Firefox from Mozilla's own packages; the harness is told where.
      - run: echo "FIREFOX_PATH=$(command -v firefox)" >> "$GITHUB_ENV"
      # npm run test:e2e, with the reporters.
      - run: node --test --test-concurrency=3 $REPORTERS "test/e2e/*.e2e.js"
        env:
          BROWSER: firefox

  # Publishes the tested commit to GitHub Pages (custom domain in app/CNAME). Only main
  # deploys, and only after every test passed.
  deploy:
    needs: [test, firefox]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, and a newer push doesn't cancel one half way through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # The site builder uses only Node's standard library, so no npm ci.
      - run: node tools/make-site.mjs _site
        working-directory: app
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/_site
      - id: deployment
        uses: actions/deploy-pages@v5
