# The app's "Report a problem" button opens this form with the diagnostics filled in
# (?template=problem.yml&diagnostics=…, see app/src/report.js), so field ids are part of that link.
name: Report a problem
description: Something doesn't work, prints wrongly or looks broken.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A screenshot or a photo of the printed label helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Attaching the .label file (Save) helps; drag it into this box.
      placeholder: |
        1.
        2.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        The app fills this in when you use "Report a problem" (under Advanced). From elsewhere,
        use "Copy diagnostics" there and paste it here.
      render: text
